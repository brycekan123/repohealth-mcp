[project]
name = "repohealth-mcp"
version = "0.3.0"
description = "MCP server for GitHub dep-health and repo-analytics queries via SQL"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bryce Kan" }]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27",
    "google-genai>=0.3",
    "platformdirs>=4.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "respx>=0.21",
]

[project.scripts]
repohealth-mcp = "repohealth_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repohealth_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: hits real network/GitHub API (opt-in via -m integration)",
]
